name: Phase 10 production TLS validation

on:
  push:
    branches:
      - test/145-production-tls-composition
    paths:
      - '.github/workflows/phase10-production-tls-validate.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/145-production-tls-composition
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Patch production TLS acceptance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/hetznerK3sProduction.test.ts')
          source = path.read_text()

          replacements = [
              (
                  "      networking: { domain, publicBaseUrl },",
                  """      networking: {
                domain,
                publicBaseUrl,
                tls: { mode: 'acme-http-01', contactEmail: 'infra@example.test' },
              },""",
              ),
              (
                  "  expect(fixture.k3s.lastAccess).toHaveLength(1);",
                  """  expect(fixture.k3s.lastAccess).toHaveLength(1);
  expect(fixture.k3s.lastSpec?.networking).toEqual({
    domain,
    publicBaseUrl,
    tls: { mode: 'acme-http-01', contactEmail: 'infra@example.test' },
  });""",
              ),
              (
                  "  lastAccess: readonly K3sNodeAccess[] = [];\n  state: K3sClusterObservation['state'] = 'absent';",
                  """  lastAccess: readonly K3sNodeAccess[] = [];
  lastSpec?: K3sClusterSpec;
  state: K3sClusterObservation['state'] = 'absent';""",
              ),
              (
                  "    this.calls.push('ensure');\n    this.lastAccess = access;",
                  """    this.calls.push('ensure');
    this.lastAccess = access;
    this.lastSpec = spec;""",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one anchor, found {count}: {old!r}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
      - name: Regenerate dependency lock
        run: bun install
      - run: bun run build
      - run: bun run check-types
      - run: bun run lint
      - run: bun run knip:test
      - run: bun run changeset:status
      - run: bun run format
      - run: bun run test
      - run: bun run format:check
      - name: Persist validated baseline
        run: |
          rm .github/workflows/phase10-production-tls-validate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json bun.lock src/hetznerK3sProduction.test.ts .changeset/tidy-production-tls.md .github/workflows/phase10-production-tls-validate.yml
          git diff --cached --exit-code >/dev/null && exit 0
          git commit -m 'test: prove production TLS composition'
          git push origin HEAD:test/145-production-tls-composition
