name: Diagnose Phase 10 role backup

on:
  push:
    branches:
      - diag/159-role-backup

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install Minikube
        env:
          MINIKUBE_VERSION: v1.37.0
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/minikube \
            "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64"
          curl --fail --location --silent --show-error \
            --output /tmp/minikube.sha256 \
            "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64.sha256"
          echo "$(cat /tmp/minikube.sha256)  /tmp/minikube" | sha256sum --check --status
          sudo install /tmp/minikube /usr/local/bin/minikube

      - name: Install kubectl
        env:
          KUBECTL_VERSION: v1.34.1
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --fail --location --silent --show-error \
            --output /tmp/kubectl.sha256 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check --status
          sudo install /tmp/kubectl /usr/local/bin/kubectl

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Patch acceptance to inspect first backup
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/localMinikubeSupabaseRecovery.integration.test.ts')
          source = path.read_text()
          marker = "      expect(await readLatestBackupPointerAsync()).toMatch(/^database\\/\\d{8}T\\d{6}Z$/);"
          replacement = r'''      const latestBackup = await readLatestBackupPointerAsync();
      expect(latestBackup).toMatch(/^database\/\d{8}T\d{6}Z$/);
      const rolesBackup = await runAsync(
        [
          'curl',
          '--fail',
          '--silent',
          '--show-error',
          '--aws-sigv4',
          'aws:amz:us-east-1:s3',
          '--user',
          `${s3AccessKey}:${s3SecretKey}`,
          `${minioHostEndpoint}/${physicalBucket}/${latestBackup}/roles.sql`,
        ],
        'read role backup diagnostic',
      );
      const roleLines = rolesBackup
        .split('\n')
        .map((line, index) => `${index + 1}: ${line}`)
        .filter((line) => line.includes('supabase_realtime_admin'));
      throw new Error(`Role backup diagnostic:\n${roleLines.join('\n')}`);'''
          if marker not in source:
              raise SystemExit('diagnostic marker not found')
          path.write_text(source.replace(marker, replacement, 1))
          PY

      - name: Run first-backup diagnostic
        env:
          ANKH_INFRA_MINIKUBE_SUPABASE_RECOVERY_E2E: '1'
        run: bun test src/localMinikubeSupabaseRecovery.integration.test.ts

      - name: Cleanup diagnostic infrastructure
        if: always()
        run: |
          minikube delete -p infra145-minikube-supabase-recovery || true
          docker rm --force infra145-minio-recovery || true
