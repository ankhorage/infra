name: Refresh Phase 8 Kubernetes driver lock

on:
  push:
    branches:
      - feat/145-local-minikube-supabase-acceptance
    paths:
      - '.github/workflows/refresh-phase8-kubernetes-lock.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@v4
        with:
          ref: feat/145-local-minikube-supabase-acceptance
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Refresh released Kubernetes driver
        run: |
          bun update --lockfile-only @ankhorage/kubernetes
          test -z "$(git diff --name-only | grep -v '^bun.lock$')"
          bun install --frozen-lockfile
          bun --eval '
          import { createRequire } from "node:module";
          import { dirname, resolve } from "node:path";

          const minikubeEntry = import.meta.resolve("@ankhorage/minikube");
          const minikubeRequire = createRequire(minikubeEntry);
          const driverEntry = minikubeRequire.resolve("@ankhorage/kubernetes");
          const driver = await Bun.file(resolve(dirname(driverEntry), "../package.json")).json();

          if (driver.version !== "0.7.3") {
            throw new Error(`Expected Minikube Kubernetes driver 0.7.3, got ${driver.version}`);
          }
          console.log(`Minikube Kubernetes driver: ${driver.version}`);
          '

      - name: Commit refreshed lock
        run: |
          rm .github/workflows/refresh-phase8-kubernetes-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bun.lock .github/workflows/refresh-phase8-kubernetes-lock.yml
          git commit -m 'chore: consume Kubernetes recovery driver'
          git push origin HEAD:feat/145-local-minikube-supabase-acceptance
