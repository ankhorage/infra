name: Prepare Phase 8 acceptance branch

on:
  push:
    branches:
      - feat/145-local-minikube-supabase-acceptance

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/145-local-minikube-supabase-acceptance
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - run: bun run format
      - name: Commit generated branch state
        run: |
          rm .github/workflows/tmp-phase8-prepare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: sync Phase 8 acceptance dependencies'
          git push origin HEAD:feat/145-local-minikube-supabase-acceptance
