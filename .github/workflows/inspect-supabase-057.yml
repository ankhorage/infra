name: Inspect Supabase 0.5.7 integrity

on:
  push:
    branches:
      - test/145-s3-backup-recovery
    paths:
      - .github/workflows/inspect-supabase-057.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read published integrity
        run: npm view @ankhorage/supabase@0.5.7 dist.integrity
