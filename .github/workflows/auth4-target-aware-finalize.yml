name: Auth 4 Target-aware Redirect Finalizer

on:
  push:
    branches:
      - agent/auth4-target-aware-redirects

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Switch Auth generator to target-aware policy
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/adapters/minikube/auth/index.ts')
          text = path.read_text()
          old_import = "import { generateSupabaseOAuthRuntimeArtifacts } from './oauthRuntime';"
          new_import = "import { generateTargetAwareSupabaseOAuthRuntimeArtifacts } from './targetAwareOAuthRuntime';"
          old_call = 'generateSupabaseOAuthRuntimeArtifacts({ appManifest, manifest })'
          new_call = 'generateTargetAwareSupabaseOAuthRuntimeArtifacts({ appManifest, manifest })'
          if text.count(old_import) != 1 or text.count(old_call) != 1:
              raise SystemExit('Auth generator source drifted before Auth 4 finalization.')
          path.write_text(text.replace(old_import, new_import).replace(old_call, new_call))
          PY

      - name: Refresh dependencies
        run: bun install

      - name: Format authored slice
        run: |
          bun run lint:fix
          bun run format

      - name: Commit authored slice and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src package.json bun.lock .changeset/auth4-target-aware-redirects.md
          git commit -m 'Complete Auth 4 target-aware redirects'

      - name: Validate Infra
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck
          bun run docs
          bun run format
          bunx @ankhorage/ankh doctor validate .
          bun run changeset:status
          unexpected="$(git diff --name-only | grep -Ev '^(README\.md|paradox/.*|\.github/workflows/auth4-target-aware-finalize\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected mutation after validation:'
            echo "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Commit generated docs and remove finalizer
        run: |
          rm .github/workflows/auth4-target-aware-finalize.yml
          git add README.md paradox .github/workflows/auth4-target-aware-finalize.yml
          git commit -m 'Refresh Auth 4 Infra docs'
          git push origin HEAD:agent/auth4-target-aware-redirects
