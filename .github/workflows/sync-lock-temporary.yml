name: Temporary Bun lock sync

on:
  push:
    branches:
      - feat/infra-169-project-credential-store

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: feat/infra-169-project-credential-store
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Synchronize lockfile
        run: bun install --lockfile-only

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: synchronize Bun lockfile"
          git push origin HEAD:feat/infra-169-project-credential-store
