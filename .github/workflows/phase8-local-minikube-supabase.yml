name: Phase 8 local Minikube Supabase

on:
  pull_request:
    paths:
      - '.github/workflows/phase8-local-minikube-supabase.yml'
      - 'src/localMinikubeSupabase.integration.test.ts'
      - 'src/features/environment-lifecycle/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install Minikube
        env:
          MINIKUBE_VERSION: v1.37.0
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/minikube \
            "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64"
          curl --fail --location --silent --show-error \
            --output /tmp/minikube.sha256 \
            "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64.sha256"
          echo "$(cat /tmp/minikube.sha256)  /tmp/minikube" | sha256sum --check --status
          sudo install /tmp/minikube /usr/local/bin/minikube
          minikube version

      - name: Install kubectl
        env:
          KUBECTL_VERSION: v1.34.1
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --fail --location --silent --show-error \
            --output /tmp/kubectl.sha256 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check --status
          sudo install /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client=true

      - name: Verify Docker
        run: docker info

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run local Minikube Supabase acceptance
        run: bun run test:e2e:minikube-supabase

      - name: Collect Minikube diagnostics
        if: failure()
        run: |
          minikube -p infra145-minikube-supabase kubectl -- get pods --all-namespaces -o wide || true
          minikube -p infra145-minikube-supabase logs || true

      - name: Delete acceptance profile
        if: always()
        run: minikube delete -p infra145-minikube-supabase || true
