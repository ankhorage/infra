name: Phase 10 production persistence baseline

on:
  push:
    branches:
      - test/145-production-persistence-baseline
    paths:
      - '.github/workflows/phase10-persistence-baseline.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/145-production-persistence-baseline
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: python3 .github/phase10-persistence-baseline.py
      - run: bun install
      - run: bun run build
      - run: bun run check-types
      - run: bun run lint
      - run: bun run knip:test
      - run: bun run changeset:status
      - run: bun run format
      - run: bun run test
      - run: bun run format:check
      - name: Persist validated baseline
        run: |
          rm .github/phase10-persistence-baseline.py
          rm .github/workflows/phase10-persistence-baseline.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json bun.lock src/hetznerK3sProduction.test.ts .changeset/steady-production-persistence.md .github/phase10-persistence-baseline.py .github/workflows/phase10-persistence-baseline.yml
          git commit -m 'test: prove production persistence baseline'
          git push origin HEAD:test/145-production-persistence-baseline
# registration trigger
