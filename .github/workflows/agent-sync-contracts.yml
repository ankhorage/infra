name: Agent sync Contracts dependency

on:
  push:
    branches:
      - agent/consume-contracts-manifest-parser

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consume-contracts-manifest-parser
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install
      - run: bun run lint:fix || true
      - run: bun run format
      - name: Commit dependency and formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: sync Contracts dependency"
          git push
