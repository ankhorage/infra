name: Validate seeded persistence baseline

on:
  push:
    branches:
      - test/145-production-persistence-baseline
    paths:
      - '.github/workflows/validate-158-seeded-persistence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/145-production-persistence-baseline
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Resolve released persistence baseline
        run: bun update @ankhorage/contracts@^19.4.0 @ankhorage/k3s@^0.4.1 @ankhorage/minikube@^0.4.2 @ankhorage/supabase@^0.4.9
      - name: Add image-seed production assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/hetznerK3sProduction.test.ts')
          text = path.read_text()
          anchor = "  expect(fixture.kubernetes.serializedResources()).toContain('/etc/postgresql-custom');\n"
          replacement = anchor + "  expect(fixture.kubernetes.serializedResources()).toContain('.ankhorage-image-seeded');\n"
          if replacement not in text:
              if anchor not in text:
                  raise SystemExit('Expected persistence assertion anchor not found.')
              text = text.replace(anchor, replacement, 1)
              path.write_text(text)
          PY
      - run: bun run build
      - run: bun run check-types
      - run: bun run lint
      - run: bun run knip:check
      - run: bun run changeset:status
      - run: bun run format
      - run: bun run test
      - run: bun run docs
      - run: bun run format
      - run: bun run format:check
      - name: Persist validated baseline
        run: |
          rm .github/workflows/validate-158-seeded-persistence.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json bun.lock src/hetznerK3sProduction.test.ts .github/workflows/phase8-local-minikube-supabase.yml README.md paradox .github/workflows/validate-158-seeded-persistence.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test: consume seeded persistence releases'
          git push origin HEAD:test/145-production-persistence-baseline
