name: Refresh Supabase 0.5.8 recovery lock

on:
  push:
    branches:
      - test/145-s3-backup-recovery

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/145-s3-backup-recovery
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Verify published Supabase version
        run: |
          for attempt in $(seq 1 12); do
            version="$(npm view @ankhorage/supabase@0.5.8 version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$version" = '0.5.8' ]; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo 'Supabase 0.5.8 is still unavailable from the npm registry.' >&2
              exit 1
            fi
            sleep 10
          done

      - name: Refresh lockfile
        run: bun install

      - name: Commit lockfile and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git rm .github/workflows/refresh-supabase-058-lock.yml
          git commit -m 'chore: refresh Supabase 0.5.8 recovery lock'
          git push origin HEAD:test/145-s3-backup-recovery
