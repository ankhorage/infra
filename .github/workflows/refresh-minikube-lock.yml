name: Refresh Supabase recovery dependency

on:
  push:
    branches:
      - test/145-s3-backup-recovery

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/145-s3-backup-recovery
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Update Supabase recovery dependency
        run: |
          sed -i 's/"@ankhorage\/supabase": "\^0\.5\.3"/"@ankhorage\/supabase": "^0.5.4"/' package.json
          sed -i 's/Supabase 0\.5\.3/Supabase 0.5.4/g' .github/workflows/phase8-local-minikube-supabase.yml .github/workflows/phase10-minikube-supabase-recovery.yml
          sed -i 's/supabase\.version !== "0\.5\.3"/supabase.version !== "0.5.4"/g' .github/workflows/phase8-local-minikube-supabase.yml .github/workflows/phase10-minikube-supabase-recovery.yml
          bun install

      - name: Commit dependency refresh when changed
        run: |
          if git diff --quiet -- package.json bun.lock .github/workflows/phase8-local-minikube-supabase.yml .github/workflows/phase10-minikube-supabase-recovery.yml; then
            echo 'Supabase recovery dependency already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock .github/workflows/phase8-local-minikube-supabase.yml .github/workflows/phase10-minikube-supabase-recovery.yml
          git commit -m 'chore: refresh Supabase recovery dependency'
          git push origin HEAD:test/145-s3-backup-recovery
