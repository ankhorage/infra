name: Task 145 format diagnostics

on:
  push:
    branches:
      - test/145-s3-backup-recovery
    paths:
      - '.github/workflows/task-145-format-diagnostics.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Create scoped repository token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ANKHORAGE_RENOVATE_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.ANKHORAGE_RENOVATE_SYNC_PRIVATE_KEY }}
          owner: ankhorage
          repositories: infra
          permission-contents: write

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/145-s3-backup-recovery
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format diagnostics
        run: bun run format

      - name: Commit formatted diagnostic
        run: |
          git config user.name 'ankhorage-renovate-sync[bot]'
          git config user.email 'ankhorage-renovate-sync[bot]@users.noreply.github.com'
          git add src/localMinikubeSupabaseRecovery.integration.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format phase 10 diagnostics'
          git push origin HEAD:test/145-s3-backup-recovery
