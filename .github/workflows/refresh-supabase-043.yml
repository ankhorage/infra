name: Refresh Supabase 0.4.3 lock

on:
  push:
    branches:
      - feat/145-local-minikube-supabase-acceptance
    paths:
      - '.github/workflows/refresh-supabase-043.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Resolve released Supabase fix
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          manifest.devDependencies['@ankhorage/supabase'] = '^0.4.3';
          writeFileSync('package.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          bun install --lockfile-only
          bun install --frozen-lockfile
      - name: Verify resolved runtime packages
        run: |
          bun --eval '
          import { createRequire } from "node:module";
          import { dirname, resolve } from "node:path";
          const supabaseEntry = import.meta.resolve("@ankhorage/supabase");
          const supabase = await Bun.file(new URL("../package.json", supabaseEntry)).json();
          const minikubeRequire = createRequire(import.meta.resolve("@ankhorage/minikube"));
          const driverEntry = minikubeRequire.resolve("@ankhorage/kubernetes");
          const driver = await Bun.file(resolve(dirname(driverEntry), "../package.json")).json();
          if (supabase.version !== "0.4.3") throw new Error(`Unexpected Supabase provider: ${supabase.version}`);
          if (driver.version !== "0.7.1") throw new Error(`Unexpected Minikube driver: ${driver.version}`);
          console.log(`Supabase ${supabase.version}; Minikube driver ${driver.version}`);
          '
      - name: Commit refreshed dependency state and remove this workflow
        env:
          TARGET_BRANCH: feat/145-local-minikube-supabase-acceptance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-supabase-043.yml
          git add package.json bun.lock
          git commit -m 'test: consume Supabase webhooks bootstrap fix'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
