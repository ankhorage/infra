name: Task 145 production persistence fixture

on:
  push:
    branches:
      - test/145-s3-backup-recovery
    paths:
      - '.github/workflows/task-145-production-persistence.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: test/145-s3-backup-recovery

      - name: Update production persistence composition
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/hetznerK3sProduction.test.ts')
          text = path.read_text()
          text = text.replace(
              "const domain = 'api.production.example.test';\n",
              "const domain = 'api.production.example.test';\nconst persistenceTarget = {\n  endpoint: 'https://s3.production.example.test',\n  region: 'eu-central-1',\n  bucket: 'infra145-database-backups',\n  credentials: { source: 'control-plane', name: 'S3_PERSISTENCE' },\n  forcePathStyle: true,\n} as const;\n",
          )
          text = text.replace(
              "      database: { provider: 'supabase', tier: 'prod' },\n      auth: { provider: 'supabase' },\n",
              "      database: {\n        provider: 'supabase',\n        tier: 'prod',\n        backup: { mode: 'scheduled', target: persistenceTarget, intervalHours: 24 },\n      },\n      auth: { provider: 'supabase' },\n      objectStorage: {\n        provider: 'supabase',\n        buckets: ['media'],\n        backend: { ...persistenceTarget, bucket: 'infra145-storage' },\n      },\n",
          )
          text = text.replace(
              "  expect(JSON.stringify(firstUp)).not.toContain('phase10-service-role-key');\n",
              "  expect(JSON.stringify(firstUp)).not.toContain('phase10-service-role-key');\n  expect(JSON.stringify(firstUp)).not.toContain('phase10-s3-secret-key');\n",
          )
          text = text.replace(
              "  expect(fixture.kubernetes.serializedResources()).toContain('.ankhorage-image-seeded');\n",
              "  expect(fixture.kubernetes.serializedResources()).toContain('.ankhorage-image-seeded');\n  expect(fixture.kubernetes.serializedResources()).toContain('supabase-db-backup');\n  expect(\n    fixture.kubernetes.resources.filter(({ kind }) => kind === 'PersistentVolumeClaim'),\n  ).toHaveLength(2);\n",
          )
          text = text.replace(
              "  if (name === 'SUPABASE_BOOTSTRAP') {\n",
              "  if (name === 'S3_PERSISTENCE') {\n    return success({ accessKeyId: 'phase10-s3-access', secretAccessKey: 'phase10-s3-secret-key' });\n  }\n  if (name === 'SUPABASE_BOOTSTRAP') {\n",
          )
          path.write_text(text)
          PY

      - name: Commit production persistence fixture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hetznerK3sProduction.test.ts
          git commit -m 'test: compose production s3 persistence'
          git push origin HEAD:test/145-s3-backup-recovery
