name: Phase 10 refresh Supabase lock

on:
  push:
    paths:
      - '.github/workflows/phase10-refresh-supabase-lock.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/145-s3-backup-recovery
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Refresh Supabase dependency lock
        run: |
          rm -rf "$HOME/.bun/install/cache"
          npm view '@ankhorage/supabase@0.5.3' version
          bun add --dev '@ankhorage/supabase@^0.5.3'

      - name: Commit refreshed lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          git commit -m 'chore: update Supabase recovery dependency'
          git push origin HEAD:test/145-s3-backup-recovery
