name: Temporary acceptance fixture patch

on:
  push:
    branches:
      - test/170-fresh-local-supabase-bootstrap

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: test/170-fresh-local-supabase-bootstrap
          fetch-depth: 0

      - name: Apply fixture updates
        run: python .github/patch-170-fixtures.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format repository
        run: bun run format

      - name: Commit fixture updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/localK3sSupabase.test.ts src/localMinikubeSupabaseRecovery.integration.test.ts
          git commit -m "test(infra): complete Contracts 21 acceptance fixtures"
          git push origin HEAD:test/170-fresh-local-supabase-bootstrap
