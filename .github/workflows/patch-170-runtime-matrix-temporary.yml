name: Temporary bootstrap acceptance patch

on:
  push:
    branches:
      - test/170-fresh-local-supabase-bootstrap

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: test/170-fresh-local-supabase-bootstrap
          fetch-depth: 0

      - name: Apply runtime-neutral bootstrap acceptance updates
        run: python .github/patch-170-runtime-matrix.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format acceptance tests
        run: bun run format

      - name: Commit acceptance updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/localMinikubeSupabase.integration.test.ts \
                  src/localK3sSupabase.test.ts \
                  src/localDockerComposeProviders.integration.test.ts
          git commit -m "test(infra): prove runtime-neutral Supabase bootstrap reuse"
          git push origin HEAD:test/170-fresh-local-supabase-bootstrap
