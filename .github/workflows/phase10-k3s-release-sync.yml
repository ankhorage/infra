name: Sync Phase 10 k3s release

on:
  push:
    branches:
      - test/145-hetzner-k3s-production-composition
    paths:
      - '.github/workflows/phase10-k3s-release-sync.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/145-hetzner-k3s-production-composition
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate dependency lock
        run: bun install
      - run: bun run build
      - run: bun run check-types
      - run: bun run lint
      - run: bun run knip:test
      - run: bun run test
      - run: bun run changeset:status
      - run: bun run format
      - run: bun run format:check
      - name: Commit validated release sync
        run: |
          rm .github/workflows/phase10-k3s-release-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bun.lock .github/workflows/phase10-k3s-release-sync.yml
          git commit -m 'chore: sync current k3s release'
          git push origin HEAD:test/145-hetzner-k3s-production-composition
