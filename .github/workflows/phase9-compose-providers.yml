name: Persist Phase 9 Docker Compose acceptance baseline

on:
  push:
    branches:
      - test/145-docker-compose-provider-proof
    paths:
      - '.github/workflows/phase9-compose-providers.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/145-docker-compose-provider-proof
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Consume accepted provider releases
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if bun update @ankhorage/docker-compose@^0.5.3 @ankhorage/supabase@^0.4.7; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - run: bun run build
      - run: bun run check-types
      - run: bun run lint
      - run: bun run knip:test
      - run: bun run test
      - run: bun run format
      - run: git diff --exit-code -- src
      - name: Persist released Compose acceptance baseline
        shell: bash
        run: |
          rm .github/workflows/phase9-compose-providers.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json bun.lock .github/workflows/phase9-compose-providers.yml
          git commit -m 'test: consume released Docker Compose provider fixes'
          git push origin HEAD:test/145-docker-compose-provider-proof
