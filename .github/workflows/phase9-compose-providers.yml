name: Phase 9 Docker Compose provider acceptance

on:
  push:
    branches:
      - test/145-docker-compose-provider-proof
    paths:
      - '.github/workflows/phase9-compose-providers.yml'
      - 'src/localDockerComposeProviders.integration.test.ts'
      - 'package.json'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/145-docker-compose-provider-proof
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check-types
      - run: bun run lint
      - run: bun run knip:test
      - name: Run Docker Compose provider acceptance
        shell: bash
        run: |
          set +e
          bun run test:e2e:docker-compose-providers
          status=$?
          if [ "$status" -ne 0 ]; then
            docker ps --all --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}'
            for container in $(docker ps --all --quiet); do
              echo "::group::docker inspect $container"
              docker inspect --format '{{.Name}} state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} exit={{.State.ExitCode}} error={{.State.Error}}' "$container" || true
              echo '::endgroup::'
              echo "::group::docker logs $container"
              docker logs --tail 120 "$container" || true
              echo '::endgroup::'
            done
          fi
          exit "$status"
