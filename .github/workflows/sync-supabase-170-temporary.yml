name: Temporary Supabase dependency sync

on:
  push:
    branches:
      - test/170-fresh-local-supabase-bootstrap

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: test/170-fresh-local-supabase-bootstrap
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Verify npm registry publication
        shell: bash
        run: |
          echo "npm registry: $(npm config get registry)"
          npm view @ankhorage/supabase version --registry=https://registry.npmjs.org
          curl --fail --silent --show-error \
            https://registry.npmjs.org/@ankhorage%2fsupabase \
            --output /tmp/supabase-registry.json
          node <<'NODE'
          const registry = require('/tmp/supabase-registry.json');
          console.log(`npm latest: ${registry['dist-tags']?.latest ?? '<missing>'}`);
          console.log(`npm has 0.5.10: ${registry.versions?.['0.5.10'] !== undefined}`);
          if (registry.versions?.['0.5.10'] === undefined) process.exit(2);
          NODE

      - name: Update released Supabase provider with a fresh Bun cache
        shell: bash
        run: |
          rm -rf "$HOME/.bun/install/cache"
          bun add --dev @ankhorage/supabase@^0.5.10

      - name: Commit dependency update
        shell: bash
        run: |
          if git diff --quiet -- package.json bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "test(infra): use released Supabase bootstrap provider"
          git push origin HEAD:test/170-fresh-local-supabase-bootstrap
