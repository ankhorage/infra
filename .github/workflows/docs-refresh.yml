name: Docs refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate docs and remove helper workflow
        run: |
          bun run docs
          rm .github/workflows/docs-refresh.yml
      - name: Commit generated docs
        run: |
          git config user.name "ankhorage-docs-refresh[bot]"
          git config user.email "ankhorage-docs-refresh[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: refresh generated infra documentation"
          git push origin "HEAD:${{ github.head_ref }}"
