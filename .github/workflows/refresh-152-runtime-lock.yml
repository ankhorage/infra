name: Refresh Phase 8 runtime lock

on:
  push:
    branches:
      - feat/145-local-minikube-supabase-acceptance

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Refresh and verify runtime dependencies
        run: |
          bun install --lockfile-only
          bun install --frozen-lockfile
          bun --eval '
          import { createRequire } from "node:module";
          import { dirname, resolve } from "node:path";

          const minikubeEntry = import.meta.resolve("@ankhorage/minikube");
          const minikube = await Bun.file(new URL("../package.json", minikubeEntry)).json();
          const supabaseEntry = import.meta.resolve("@ankhorage/supabase");
          const supabase = await Bun.file(new URL("../package.json", supabaseEntry)).json();
          const minikubeRequire = createRequire(minikubeEntry);
          const driverEntry = minikubeRequire.resolve("@ankhorage/kubernetes");
          const driver = await Bun.file(resolve(dirname(driverEntry), "../package.json")).json();

          if (minikube.version !== "0.4.1") throw new Error(`Expected Minikube 0.4.1, got ${minikube.version}`);
          if (supabase.version !== "0.4.3") throw new Error(`Expected Supabase 0.4.3, got ${supabase.version}`);
          if (driver.version !== "0.7.2") throw new Error(`Expected Kubernetes 0.7.2, got ${driver.version}`);
          console.log(`Verified Minikube ${minikube.version}, Supabase ${supabase.version}, Kubernetes ${driver.version}`);
          '

      - name: Commit refreshed lock
        run: |
          rm .github/workflows/refresh-152-runtime-lock.yml
          git add bun.lock .github/workflows/refresh-152-runtime-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Phase 8 runtime lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
