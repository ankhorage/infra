name: Phase 8 local Minikube Supabase

on:
  pull_request:
    paths:
      - '.github/workflows/phase8-local-minikube-supabase.yml'
      - 'src/localMinikubeSupabase.integration.test.ts'
      - 'src/features/environment-lifecycle/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install Minikube
        env:
          MINIKUBE_VERSION: v1.37.0
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/minikube \
            "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64"
          curl --fail --location --silent --show-error \
            --output /tmp/minikube.sha256 \
            "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64.sha256"
          echo "$(cat /tmp/minikube.sha256)  /tmp/minikube" | sha256sum --check --status
          sudo install /tmp/minikube /usr/local/bin/minikube
          minikube version

      - name: Install kubectl
        env:
          KUBECTL_VERSION: v1.34.1
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --fail --location --silent --show-error \
            --output /tmp/kubectl.sha256 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check --status
          sudo install /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client=true

      - name: Verify Docker
        run: docker info

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify resolved runtime package versions
        run: |
          bun --eval '
          import { createRequire } from "node:module";
          import { dirname, resolve } from "node:path";

          const minikubeEntry = import.meta.resolve("@ankhorage/minikube");
          const minikube = await Bun.file(new URL("../package.json", minikubeEntry)).json();
          const supabaseEntry = import.meta.resolve("@ankhorage/supabase");
          const supabase = await Bun.file(new URL("../package.json", supabaseEntry)).json();
          const minikubeRequire = createRequire(minikubeEntry);
          const driverEntry = minikubeRequire.resolve("@ankhorage/kubernetes");
          const driver = await Bun.file(resolve(dirname(driverEntry), "../package.json")).json();

          if (minikube.version !== "0.4.2") throw new Error(`Expected Minikube 0.4.2, got ${minikube.version}`);
          if (supabase.version !== "0.5.0") throw new Error(`Expected Supabase 0.5.0, got ${supabase.version}`);
          if (driver.version !== "0.8.1") throw new Error(`Expected Kubernetes 0.8.1, got ${driver.version}`);

          console.log(`Minikube runtime: ${minikube.version}`);
          console.log(`Supabase provider: ${supabase.version}`);
          console.log(`Minikube Kubernetes driver: ${driver.version}`);
          console.log("Image-seeded persistence baseline verified.");
          '

      - name: Run local Minikube Supabase acceptance
        run: bun run test:e2e:minikube-supabase

      - name: Collect Supabase workload diagnostics
        if: failure()
        env:
          ACCEPTANCE_NAMESPACE: infra145-minikube-supabase-local
        run: |
          kubectl get pods --all-namespaces -o wide || true
          kubectl get events -n "${ACCEPTANCE_NAMESPACE}" --sort-by=.lastTimestamp || true

          for pod in $(kubectl get pods -n "${ACCEPTANCE_NAMESPACE}" -o name 2>/dev/null); do
            echo "::group::${pod} state"
            kubectl get -n "${ACCEPTANCE_NAMESPACE}" "${pod}" \
              -o 'jsonpath={range .status.containerStatuses[*]}{.name}{" ready="}{.ready}{" restarts="}{.restartCount}{" waiting="}{.state.waiting.reason}{" terminated="}{.lastState.terminated.reason}{" exitCode="}{.lastState.terminated.exitCode}{"\n"}{end}' || true
            echo
            echo "::endgroup::"

            echo "::group::${pod} previous logs"
            kubectl logs -n "${ACCEPTANCE_NAMESPACE}" "${pod}" --all-containers --previous --tail=160 || true
            echo "::endgroup::"

            echo "::group::${pod} current logs"
            kubectl logs -n "${ACCEPTANCE_NAMESPACE}" "${pod}" --all-containers --tail=160 || true
            echo "::endgroup::"
          done

      - name: Collect Minikube diagnostics
        if: failure()
        run: minikube -p infra145-minikube-supabase logs || true

      - name: Delete acceptance profile
        if: always()
        run: minikube delete -p infra145-minikube-supabase || true
