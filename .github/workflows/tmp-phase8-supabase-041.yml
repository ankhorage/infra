name: Prepare Phase 8 Supabase 0.4.1 acceptance

on:
  push:
    branches:
      - feat/145-local-minikube-supabase-acceptance
    paths:
      - '.github/workflows/tmp-phase8-supabase-041.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/145-local-minikube-supabase-acceptance
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node for registry verification
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install current dependencies
        run: bun install --frozen-lockfile

      - name: Verify the released Supabase adapter is registry-visible
        run: |
          for attempt in $(seq 1 12); do
            if [ "$(npm view '@ankhorage/supabase@0.4.1' version --registry=https://registry.npmjs.org 2>/dev/null)" = '0.4.1' ]; then
              exit 0
            fi
            sleep 5
          done
          npm view '@ankhorage/supabase' versions --json --registry=https://registry.npmjs.org
          exit 1

      - name: Upgrade the released Supabase adapter
        run: bun add --dev '@ankhorage/supabase@^0.4.1'

      - name: Run repository gates
        run: |
          bun run build
          bun run check-types
          bun run lint
          bun run knip:test
          bun run format

      - name: Commit verified dependency update
        run: |
          rm .github/workflows/tmp-phase8-supabase-041.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: require corrected Supabase runtime'

      - name: Validate release metadata and publish branch
        run: |
          bun run changeset:status
          git push origin HEAD:feat/145-local-minikube-supabase-acceptance
