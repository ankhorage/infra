name: Refresh Supabase recovery lock

on:
  push:
    branches:
      - test/145-s3-backup-recovery

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/145-s3-backup-recovery
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Refresh lockfile
        run: bun install

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- bun.lock; then
            echo 'Supabase recovery lock already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'chore: refresh Supabase recovery lock'
          git push origin HEAD:test/145-s3-backup-recovery
