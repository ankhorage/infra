name: Refresh PR 152 provider lock

on:
  push:
    branches:
      - feat/145-local-minikube-supabase-acceptance
    paths:
      - '.github/workflows/refresh-152-provider-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'ankhorage/infra'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Resolve the published provider fixes with Bun
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          manifest.devDependencies['@ankhorage/supabase'] = '^0.4.2';
          writeFileSync('package.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          bun install --lockfile-only
          cp package.json "${RUNNER_TEMP}/infra-package.json"
          # Ask Bun to resolve the patched transitive driver, then restore the
          # real package boundary: Infra must not depend directly on Kubernetes.
          bun add --dev --lockfile-only @ankhorage/kubernetes@0.7.1
          cp "${RUNNER_TEMP}/infra-package.json" package.json
          bun install --lockfile-only
          bun install --frozen-lockfile
      - name: Verify actual Minikube dependency resolution
        run: |
          bun --eval '
          import { createRequire } from "node:module";
          import { dirname, resolve } from "node:path";
          const minikubeRequire = createRequire(import.meta.resolve("@ankhorage/minikube"));
          const driverEntry = minikubeRequire.resolve("@ankhorage/kubernetes");
          const driver = await Bun.file(resolve(dirname(driverEntry), "../package.json")).json();
          const supabaseEntry = import.meta.resolve("@ankhorage/supabase");
          const supabase = await Bun.file(new URL("../package.json", supabaseEntry)).json();
          const manifest = await Bun.file("package.json").json();
          if (driver.version !== "0.7.1") throw new Error(`Unexpected Minikube driver: ${driver.version}`);
          if (supabase.version !== "0.4.2") throw new Error(`Unexpected Supabase provider: ${supabase.version}`);
          if (manifest.dependencies["@ankhorage/kubernetes"] || manifest.devDependencies["@ankhorage/kubernetes"]) {
            throw new Error("A temporary direct driver dependency must not remain.");
          }
          console.log(`Supabase ${supabase.version}; Minikube driver ${driver.version}`);
          '
      - name: Commit only the regenerated dependency files and remove this one-off workflow
        env:
          TARGET_BRANCH: feat/145-local-minikube-supabase-acceptance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-152-provider-lock.yml
          git add package.json bun.lock
          git diff --cached --stat
          git commit -m 'test: consume released Supabase and readiness fixes'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
