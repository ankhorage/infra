name: Phase 9 Docker Compose provider acceptance

on:
  push:
    branches:
      - test/145-docker-compose-provider-proof
    paths:
      - '.github/workflows/phase9-compose-providers.yml'
      - 'src/localDockerComposeProviders.integration.test.ts'
      - 'package.json'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/145-docker-compose-provider-proof
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check-types
      - run: bun run lint
      - run: bun run knip:test
      - run: bun run test:e2e:docker-compose-providers
